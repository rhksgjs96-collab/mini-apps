<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1‑3‑5 Planner</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#2a2f3a;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#5b8cff; --good:#3ecf8e;
    --big:#ffb454; --med:#7aa2ff; --small:#8f8fff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px}
  a.back{color:var(--muted);text-decoration:none;font-size:13px;margin-left:auto}
  a.back:hover{color:var(--text)}

  .ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;
    background:
      radial-gradient(closest-side,var(--panel) 79%,transparent 80% 100%),
      conic-gradient(var(--good) calc(var(--p)*1%),var(--panel-2) 0);
    display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--good)}

  .group{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:14px}
  .group h2{margin:0 0 10px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%}
  .big .dot{background:var(--big)} .med .dot{background:var(--med)} .small .dot{background:var(--small)}

  .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row input[type=checkbox]{appearance:none;width:18px;height:18px;flex:none;border-radius:6px;
    border:1.5px solid var(--line);background:var(--panel-2);cursor:pointer;position:relative}
  .row input[type=checkbox]:checked{background:var(--good);border-color:var(--good)}
  .row input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;
    width:5px;height:10px;border:2px solid #06231a;border-top:0;border-left:0;transform:rotate(42deg)}
  .row input[type=text]{flex:1;background:transparent;border:0;color:var(--text);font:inherit;padding:4px 2px}
  .row input[type=text]:focus{outline:0}
  .row.done input[type=text]{color:var(--muted);text-decoration:line-through}

  footer{display:flex;gap:10px;margin-top:22px;align-items:center;color:var(--muted);font-size:13px}
  button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .date{margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ring" id="ring">0%</div>
    <div>
      <h1>1‑3‑5 Planner</h1>
      <div class="sub">One big thing. Three medium. Five small. That's a day.</div>
    </div>
    <a class="back" href="index.html">← all apps</a>
  </header>

  <div class="group big"><h2><span class="dot"></span>1 · Big</h2><div id="g-big"></div></div>
  <div class="group med"><h2><span class="dot"></span>3 · Medium</h2><div id="g-med"></div></div>
  <div class="group small"><h2><span class="dot"></span>5 · Small</h2><div id="g-small"></div></div>

  <footer>
    <button id="clear">Clear checked</button>
    <button id="reset">New day</button>
    <span class="date" id="date"></span>
  </footer>
</div>

<script>
const KEY = "planner-135-v1";
const shape = {big:1, med:3, small:5};
let state = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.tasks) return s;
  }catch(e){}
  return fresh();
}
function fresh(){
  const tasks = {};
  for(const k in shape) tasks[k] = Array.from({length:shape[k]}, ()=>({text:"",done:false}));
  return {day:new Date().toISOString().slice(0,10), tasks};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); render(); }

function render(){
  for(const k in shape){
    const host = document.getElementById("g-"+k);
    host.innerHTML = "";
    state.tasks[k].forEach((t,i)=>{
      const row = document.createElement("label");
      row.className = "row" + (t.done ? " done":"");
      const cb = document.createElement("input");
      cb.type="checkbox"; cb.checked=t.done;
      cb.onchange = ()=>{ t.done = cb.checked; save(); };
      const tx = document.createElement("input");
      tx.type="text"; tx.value=t.text; tx.placeholder = k==="big"?"the one that matters…":"…";
      tx.oninput = ()=>{ t.text = tx.value; localStorage.setItem(KEY, JSON.stringify(state)); updateRing(); };
      row.append(cb, tx);
      host.append(row);
    });
  }
  updateRing();
  document.getElementById("date").textContent = state.day;
}
function updateRing(){
  let total=0, done=0;
  for(const k in shape) state.tasks[k].forEach(t=>{ if(t.text.trim()){ total++; if(t.done) done++; }});
  const p = total ? Math.round(done/total*100) : 0;
  const ring = document.getElementById("ring");
  ring.style.setProperty("--p", p);
  ring.textContent = p + "%";
}
document.getElementById("clear").onclick = ()=>{
  for(const k in shape) state.tasks[k].forEach(t=>{ if(t.done){ t.text=""; t.done=false; }});
  save();
};
document.getElementById("reset").onclick = ()=>{
  if(confirm("Start a fresh day? Current list will be cleared.")){ state = fresh(); save(); }
};
render();
</script>
</body>
</html>
