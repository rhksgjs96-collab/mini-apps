<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root{--bg:#0c0d12;--panel:#161821;--line:#2a2f3a;--text:#e7e9ee;--muted:#9aa3b2;
    --accent:#5b8cff;--snake:#3ecf8e;--food:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;font-weight:650}
  header a{color:var(--muted);text-decoration:none;font-size:13px;margin-left:auto}
  header a:hover{color:var(--text)}
  .scores{display:flex;gap:28px;margin:18px 0 12px;font-variant-numeric:tabular-nums}
  .scores div{text-align:center}
  .scores b{display:block;font-size:24px;font-weight:700}
  .scores span{color:var(--muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
  .stage{position:relative}
  canvas{background:#000;border-radius:12px;border:1px solid var(--line);display:block;touch-action:none}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    background:rgba(8,9,13,.72);border-radius:12px;backdrop-filter:blur(2px)}
  .overlay.hidden{display:none}
  .overlay h2{margin:0 0 6px;font-size:22px}
  .overlay p{margin:0 0 14px;color:var(--muted)}
  button{background:var(--accent);color:#08131f;border:0;border-radius:9px;
    padding:10px 20px;font:inherit;font-weight:650;cursor:pointer}
  .hint{color:var(--muted);font-size:12px;margin:14px 0 30px}
</style>
</head>
<body>
<header>
  <h1>Snake</h1>
  <a href="index.html">← all apps</a>
</header>

<div class="scores">
  <div><b id="score">0</b><span>score</span></div>
  <div><b id="best">0</b><span>best</span></div>
</div>

<div class="stage">
  <canvas id="c" width="440" height="440"></canvas>
  <div class="overlay" id="ov">
    <div>
      <h2 id="ovTitle">Snake</h2>
      <p id="ovText">Arrow keys / WASD / swipe</p>
      <button id="play">Play</button>
    </div>
  </div>
</div>
<div class="hint">Eat the red. Don't hit yourself. It gets faster.</div>

<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
const N = 20, CELL = c.width / N;
const KEY = "snake-best-v1";

let snake, dir, nextDir, food, score, alive, speed, acc, running;
let best = +(localStorage.getItem(KEY) || 0);
document.getElementById("best").textContent = best;

function reset(){
  snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir = {x:1,y:0}; nextDir = dir;
  score = 0; speed = 8; acc = 0; alive = true;
  placeFood();
  document.getElementById("score").textContent = 0;
}
function placeFood(){
  do{ food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
  while(snake.some(s=>s.x===food.x && s.y===food.y));
}
function setDir(x,y){
  if(snake && (x === -dir.x && y === -dir.y)) return; // no 180
  nextDir = {x,y};
}
addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if(k==="arrowup"||k==="w") setDir(0,-1);
  else if(k==="arrowdown"||k==="s") setDir(0,1);
  else if(k==="arrowleft"||k==="a") setDir(-1,0);
  else if(k==="arrowright"||k==="d") setDir(1,0);
  else return;
  e.preventDefault();
});
// swipe
let ts=null;
c.addEventListener("touchstart", e=>{ ts = e.touches[0]; }, {passive:true});
c.addEventListener("touchmove", e=>{
  if(!ts) return;
  const t = e.touches[0], dx = t.clientX-ts.clientX, dy = t.clientY-ts.clientY;
  if(Math.hypot(dx,dy) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0); else setDir(0, dy>0?1:-1);
  ts = null;
}, {passive:true});

function step(){
  dir = nextDir;
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
    alive = false; endGame(); return;
  }
  snake.unshift(head);
  if(head.x===food.x && head.y===food.y){
    score++;
    document.getElementById("score").textContent = score;
    if(score % 4 === 0) speed = Math.min(20, speed + 1);
    placeFood();
  } else {
    snake.pop();
  }
}
function draw(){
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = "#12151c";
  for(let i=1;i<N;i++){
    ctx.fillRect(i*CELL,0,1,c.height);
    ctx.fillRect(0,i*CELL,c.width,1);
  }
  // food
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--food");
  round(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4, 5);
  // snake
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? "#7bf7c0" : getComputedStyle(document.documentElement).getPropertyValue("--snake");
    round(s.x*CELL+1.5, s.y*CELL+1.5, CELL-3, CELL-3, 5);
  });
}
function round(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h);
  ctx.fill();
}

let lastT = 0;
function loop(t){
  if(!running) return;
  const dt = (t - lastT) / 1000; lastT = t;
  acc += dt;
  const interval = 1 / speed;
  while(acc >= interval && alive){ step(); acc -= interval; }
  draw();
  requestAnimationFrame(loop);
}
function start(){
  reset();
  document.getElementById("ov").classList.add("hidden");
  running = true; lastT = performance.now();
  requestAnimationFrame(loop);
}
function endGame(){
  running = false;
  if(score > best){ best = score; localStorage.setItem(KEY, best); }
  document.getElementById("best").textContent = best;
  const ov = document.getElementById("ov");
  document.getElementById("ovTitle").textContent = "Game over";
  document.getElementById("ovText").textContent = `Score ${score}` + (score===best && score>0 ? " — new best!" : "");
  document.getElementById("play").textContent = "Play again";
  ov.classList.remove("hidden");
  draw();
}
document.getElementById("play").onclick = start;
reset(); draw();
</script>
</body>
</html>
